allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Workaround for plugins that don't declare an Android namespace yet
// (required by AGP 8+). Known case: isar_flutter_libs 3.1.0+1.
// NOTE: must run BEFORE `evaluationDependsOn(":app")` forces the app
// module to evaluate (afterEvaluate fails on already-evaluated projects).
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android') && project.android.namespace == null) {
            project.android.namespace = project.group.toString()
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
