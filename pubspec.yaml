name: lingua_plus
description: "Lingua+ — دیکشنری آفلاین، کتابخانه دوزبانه، مترجم هوشمند و یادگیری انگلیسی"
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Local database (offline dictionary, favorites, SRS)
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  path_provider: ^2.1.5

  # Networking (online translator — free APIs, no API key)
  dio: ^5.7.0

  # Immutable entities
  freezed_annotation: ^2.4.4

  # Preferences
  shared_preferences: ^2.3.4

  # Speech
  flutter_tts: ^4.1.0
  speech_to_text: ^6.6.2

  # Sharing
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: 3.1.0+1
  freezed: 2.5.2
  build_runner: ^2.4.13

dependency_overrides:
  js: ^0.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/covers/
    - assets/books/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
